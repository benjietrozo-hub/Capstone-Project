<!DOCTYPE html>
<html>
<head>
    <title>Exact Frontend Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .log { margin: 5px 0; padding: 5px; background: white; border-left: 3px solid #333; }
        .error { border-left-color: red; background: #fee; }
        .success { border-left-color: green; background: #efe; }
        .info { border-left-color: blue; background: #eef; }
        pre { background: #f9f9f9; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Exact Frontend API Test</h1>
    <button onclick="runTest()">Run Test</button>
    <button onclick="clearLogs()">Clear</button>
    <div id="logs"></div>

    <script>
        const API_URL = 'http://localhost/OlineIMS/backend/public/api';
        
        function log(message, type = 'log') {
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.innerHTML = message;
            document.getElementById('logs').appendChild(div);
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function runTest() {
            clearLogs();
            log('=== STARTING TEST ===', 'info');
            
            try {
                // Step 1: Login
                log('<strong>Step 1: Login</strong>', 'info');
                const loginResponse = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'benjie.trozo',
                        password: 'p@ssw0rd',
                    }),
                });

                log(`Login Status: ${loginResponse.status}`, loginResponse.ok ? 'success' : 'error');
                
                const loginData = await loginResponse.json();
                log(`<pre>${JSON.stringify(loginData, null, 2)}</pre>`);

                if (!loginResponse.ok || !loginData.token) {
                    log('❌ Login failed!', 'error');
                    return;
                }

                const token = loginData.token;
                log(`✅ Token: ${token.substring(0, 30)}...`, 'success');
                log(`✅ User: ${loginData.user.username}`, 'success');
                log(`✅ Role: ${loginData.role}`, 'success');

                // Step 2: Fetch Inventory (exactly like frontend)
                log('<strong>Step 2: Fetch Inventory</strong>', 'info');
                
                const inventoryUrl = `${API_URL}/admin/inventory?search=&category=&per_page=50`;
                log(`URL: ${inventoryUrl}`);
                
                const inventoryResponse = await fetch(inventoryUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                });

                log(`Inventory Status: ${inventoryResponse.status}`, inventoryResponse.ok ? 'success' : 'error');
                log(`Inventory Status Text: ${inventoryResponse.statusText}`);
                
                // Log response headers
                log('<strong>Response Headers:</strong>');
                for (let [key, value] of inventoryResponse.headers.entries()) {
                    log(`  ${key}: ${value}`);
                }

                const inventoryData = await inventoryResponse.json();
                
                log('<strong>Response Data:</strong>');
                log(`<pre>${JSON.stringify(inventoryData, null, 2)}</pre>`);

                if (inventoryResponse.ok) {
                    const itemsCount = inventoryData.data?.length || 0;
                    const total = inventoryData.total || 0;
                    
                    if (itemsCount > 0) {
                        log(`✅ SUCCESS! Found ${itemsCount} items (Total: ${total})`, 'success');
                        log('<strong>Items:</strong>');
                        inventoryData.data.forEach(item => {
                            log(`  • ${item.item_code}: ${item.item_name} (${item.category})`);
                        });
                    } else {
                        log(`❌ EMPTY ARRAY! Total: ${total}, Items: ${itemsCount}`, 'error');
                        log('This is the problem - API returns 200 but empty data array');
                    }
                } else {
                    log('❌ Request failed!', 'error');
                }

            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
            
            log('=== TEST COMPLETE ===', 'info');
        }

        // Auto-run on load
        window.onload = () => {
            log('Ready. Click "Run Test" to start.', 'info');
        };
    </script>
</body>
</html>
