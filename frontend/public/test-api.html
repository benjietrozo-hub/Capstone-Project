<!DOCTYPE html>
<html>
<head>
    <title>Test Admin Inventory API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Admin Inventory API Test</h1>
    <div id="status"></div>
    <button onclick="testLogin()">1. Test Login</button>
    <button onclick="testInventory()" id="inventoryBtn" disabled>2. Test Inventory</button>
    <button onclick="clearResults()">Clear</button>
    <div id="results"></div>

    <script>
        const API_URL = 'http://localhost/OlineIMS/backend/public/api';
        let authToken = null;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').innerHTML = '';
        }

        async function testLogin() {
            clearResults();
            log('<h2>Testing Login...</h2>');
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'benjie.trozo',
                        password: 'p@ssw0rd',
                    }),
                });

                const data = await response.json();
                
                if (response.ok && data.token) {
                    authToken = data.token;
                    log(`<p class="success">✅ Login successful!</p>`);
                    log(`<p>Token: ${authToken.substring(0, 20)}...</p>`);
                    log(`<p>User: ${data.user.username}</p>`);
                    document.getElementById('inventoryBtn').disabled = false;
                    document.getElementById('status').innerHTML = '<span class="success">✅ Logged in - Ready to test inventory</span>';
                } else {
                    log(`<p class="error">❌ Login failed!</p>`);
                    log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
                }
            } catch (error) {
                log(`<p class="error">❌ Error: ${error.message}</p>`);
            }
        }

        async function testInventory() {
            if (!authToken) {
                alert('Please login first!');
                return;
            }

            log('<h2>Testing Inventory API...</h2>');
            
            try {
                const url = `${API_URL}/admin/inventory?per_page=50`;
                log(`<p>Fetching: ${url}</p>`);
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                });

                log(`<p>Response Status: ${response.status} ${response.statusText}</p>`);
                
                const data = await response.json();
                
                if (response.ok) {
                    log(`<p class="success">✅ Inventory fetched successfully!</p>`);
                    log(`<p><strong>Total Items:</strong> ${data.total || 0}</p>`);
                    log(`<p><strong>Items on Page:</strong> ${data.data?.length || 0}</p>`);
                    log(`<p><strong>Per Page:</strong> ${data.per_page}</p>`);
                    log(`<p><strong>Current Page:</strong> ${data.current_page}</p>`);
                    
                    if (data.data && data.data.length > 0) {
                        log('<h3>Items:</h3>');
                        log('<ul>');
                        data.data.forEach(item => {
                            log(`<li><strong>${item.item_code}</strong>: ${item.item_name} (${item.category}) - Status: ${item.status}</li>`);
                        });
                        log('</ul>');
                        
                        log('<h3>Full Response:</h3>');
                        log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
                    } else {
                        log('<p class="error">❌ No items in response!</p>');
                        log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
                    }
                } else {
                    log(`<p class="error">❌ Inventory fetch failed!</p>`);
                    log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
                }
            } catch (error) {
                log(`<p class="error">❌ Error: ${error.message}</p>`);
                console.error('Full error:', error);
            }
        }

        // Auto-test on load
        window.onload = function() {
            log('<p>Ready to test. Click "Test Login" to start.</p>');
        };
    </script>
</body>
</html>
